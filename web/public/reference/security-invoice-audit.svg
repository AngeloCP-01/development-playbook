<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title description">
  <title id="title">Two-user invoice authorization probe</title>
  <desc id="description">User B requests User A's invoice PDF using its known ID. The server gets User B from the session and queries for an invoice with both that ID and User B as owner. No row matches, so no PDF is returned. User A's own request remains allowed.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1L9 5.5L1 10" fill="none" stroke="#243746" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="780" fill="#f4f5f1"/>
  <path d="M32 32H608V748H32Z" fill="none" stroke="#243746" stroke-width="2"/>
  <text x="58" y="68" fill="#243746" font-family="Arial, sans-serif" font-size="28" font-weight="700">THE SAME ID, TWO USERS</text>
  <text x="58" y="96" fill="#52636c" font-family="Arial, sans-serif" font-size="18">A known invoice ID never grants access.</text>

  <rect x="58" y="124" width="524" height="76" rx="4" fill="#e7eef0" stroke="#243746" stroke-width="2"/>
  <rect x="58" y="124" width="9" height="76" fill="#23647b"/>
  <text x="84" y="154" fill="#243746" font-family="Arial, sans-serif" font-size="19" font-weight="700">ACTOR · USER B</text>
  <text x="84" y="181" fill="#243746" font-family="Arial, sans-serif" font-size="18">Signed in as B; does not own invoice A-104</text>

  <path d="M320 201V224" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="229" width="524" height="76" rx="4" fill="#fff1df" stroke="#8f4d0c" stroke-width="2"/>
  <rect x="58" y="229" width="9" height="76" fill="#aa5b08"/>
  <text x="84" y="259" fill="#603708" font-family="Arial, sans-serif" font-size="19" font-weight="700">UNTRUSTED REQUEST</text>
  <text x="84" y="286" fill="#243746" font-family="Arial, sans-serif" font-size="18">GET /api/invoices/A-104/pdf</text>

  <path d="M320 306V332" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M58 351H582" stroke="#557785" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="175" y="338" width="290" height="28" fill="#f4f5f1"/>
  <text x="320" y="358" text-anchor="middle" fill="#243746" font-family="Arial, sans-serif" font-size="17" font-weight="700">BROWSER / SERVER BOUNDARY</text>

  <rect x="58" y="380" width="524" height="100" rx="4" fill="#fff" stroke="#243746" stroke-width="2"/>
  <rect x="58" y="380" width="9" height="100" fill="#23647b"/>
  <text x="84" y="410" fill="#243746" font-family="Arial, sans-serif" font-size="19" font-weight="700">SERVER ENFORCES THE POLICY</text>
  <text x="84" y="438" fill="#243746" font-family="Arial, sans-serif" font-size="18">Caller from session = B</text>
  <text x="84" y="463" fill="#243746" font-family="Arial, sans-serif" font-size="18">Find ID A-104 AND owner B</text>

  <path d="M320 481V504" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="509" width="524" height="76" rx="4" fill="#e7eef0" stroke="#243746" stroke-width="2"/>
  <rect x="58" y="509" width="9" height="76" fill="#23647b"/>
  <text x="84" y="539" fill="#243746" font-family="Arial, sans-serif" font-size="19" font-weight="700">STORED RECORD</text>
  <text x="84" y="566" fill="#243746" font-family="Arial, sans-serif" font-size="18">ID A-104 · owner A → no matching row</text>

  <path d="M320 586V609" stroke="#243746" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="58" y="614" width="524" height="76" rx="4" fill="#fbe9e8" stroke="#aa3733" stroke-width="2"/>
  <rect x="58" y="614" width="9" height="76" fill="#aa3733"/>
  <text x="84" y="644" fill="#7d2523" font-family="Arial, sans-serif" font-size="19" font-weight="700">DENY USER B</text>
  <text x="84" y="671" fill="#243746" font-family="Arial, sans-serif" font-size="18">No PDF bytes; invoice stays unchanged</text>

  <path d="M58 712H582" stroke="#b4c4c9" stroke-width="2"/>
  <circle cx="72" cy="731" r="7" fill="#246d49"/>
  <text x="89" y="738" fill="#24543b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Positive control: User A can access A-104.</text>
</svg>
