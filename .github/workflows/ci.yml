name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Cheapest failure first: format, lint, types, unit, build.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
          check-latest: true
      - run: pnpm test
        env:
          PLAYBOOK_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: pnpm build

  python-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/lib/cheatsheets/python-published-checks.test.ts src/lib/cheatsheets/python-published.test.ts
        env:
          PLAYBOOK_PYTHON: ${{ steps.python.outputs.python-path }}

  audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
